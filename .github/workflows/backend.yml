name: Backend CI and deployment
'on':
  push:
    branches:
      - master
      - test
  pull_request:
    branches:
      - master
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      checks_only:
        description: Run all isolated checks without deploying
        type: boolean
        default: false
      legacy_maintenance:
        description: Explicit first-install or recovery procedure (not a normal release)
        type: boolean
        default: false
      production_audit:
        description: Read-only production schema/runtime preflight (no deployment)
        type: boolean
        default: false
      activate_world:
        description: Explicit public world activation on production after checked deployment
        type: boolean
        default: false
      starter_reserve:
        description: Approved initial transfer from bot to the North City starter reserve (Cr)
        type: string
        default: '0'
      progress_only:
        description: Read saved migration progress only, without waiting for deployment
        type: boolean
        default: false
      target:
        description: Deployment environment (production requires master)
        type: choice
        options:
          - test
          - production
        default: test
        required: true
      economy_test:
        description: Preview or prepare the funded MVP test (test only)
        type: choice
        options:
          - skip
          - preview
          - prepare
        default: skip
        required: true
      economy_donor:
        description: Existing test account funding the route (no credits are issued)
        type: string
        default: Test01
        required: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: Select checks from the last published release
    if: ${{ !inputs.production_audit }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      publish: ${{ steps.plan.outputs.publish }}
      runtime: ${{ steps.plan.outputs.runtime }}
      database: ${{ steps.plan.outputs.database }}
      portable: ${{ steps.plan.outputs.portable }}
      additive: ${{ steps.plan.outputs.additive }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release selection
        run: python3 deploy/tests/release-plan.py
      - name: Select changed areas
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
          FORCE_FULL: ${{ inputs.checks_only || inputs.legacy_maintenance || inputs.activate_world }}
          CHECKS_ONLY: ${{ inputs.checks_only }}
          MAINTENANCE: ${{ inputs.legacy_maintenance || inputs.activate_world || (inputs.economy_test && inputs.economy_test != 'skip') }}
        run: python3 deploy/release-plan.py
  minimum:
    name: Minimum release checks
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate requested target
        env:
          TARGET: ${{ ((github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            [[ "$GITHUB_REF_TYPE" = branch ]]
            [[ "$TARGET" = test || ( "$TARGET" = production && "$GITHUB_REF_NAME" = master ) ]]
          fi
      - name: Set up the supported PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3.36
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none
      - name: Restore locked Composer dependencies
        uses: actions/cache@v5
        with:
          path: yii2/vendor
          key: ${{ runner.os }}-php8336-minimum-${{ hashFiles('yii2/composer.lock') }}
      - name: Install production dependencies and check platform
        working-directory: yii2
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Check changed PHP and deployment guards
        env:
          PREVIOUS_SHA: ${{ needs.plan.outputs.base }}
        shell: bash
        run: |
          for script in deploy/*.sh deploy/tests/*.sh docker/php/entrypoint.sh docker/composer/entrypoint.sh; do bash -n "$script"; done
          base=
          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then base=$PREVIOUS_SHA; fi
          if [[ -n "$base" ]] && git rev-parse --verify "$base" >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.php' > "$RUNNER_TEMP/php-files"
          else
            git ls-files -z -- '*.php' > "$RUNNER_TEMP/php-files"
          fi
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < "$RUNNER_TEMP/php-files"
          php -l yii2/yii
          bash deploy/tests/pipeline.sh
          bash deploy/tests/production-release.sh
      - name: Check authentication, rewards, refunds and API routes
        working-directory: yii2
        run: |
          for suite in api-route-catalog world-player-read auth-response telegram-auth daily-reward exchange-refund frontend-api-routing classic-craft-install; do php "tests/release/$suite.php"; done
          if [[ -f tests/release/world-economy-profile.php ]]; then php tests/release/world-economy-profile.php; fi
  full_before:
    name: Required application checks before production
    needs: plan
    if: ${{ needs.plan.outputs.database == 'true' && (inputs.checks_only || !(github.ref == 'refs/heads/test' || inputs.target == 'test')) }}
    uses: ./.github/workflows/backend-full.yml
    with:
      target: ${{ inputs.checks_only && 'test' || 'production' }}
      portable: ${{ needs.plan.outputs.portable == 'true' }}
      core_checked: true
  runtime-image:
    name: PHP 8.3.36 FPM and Composer images
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Build and check the real Linux images
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          TARGET: ${{ ((github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production') }}
          CHECKS_ONLY: ${{ inputs.checks_only }}
        shell: bash
        run: |
          docker build --pull -t ablaki-php83-ci docker/php
          docker build --pull -t ablaki-composer83-ci docker/composer
          docker run --rm --entrypoint php ablaki-php83-ci -r 'if (PHP_VERSION !== "8.3.36" || ini_get("session.upload_progress.enabled") !== "0") exit(1); foreach (["pdo_mysql","pdo_pgsql","pdo_sqlite","intl","gd","mbstring","zip","curl"] as $extension) if (!extension_loaded($extension)) throw new RuntimeException($extension);'
          docker run --rm --entrypoint php ablaki-composer83-ci -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'
          docker run --rm --entrypoint composer ablaki-composer83-ci --version
          probe="$RUNNER_TEMP/php83-probe"
          mkdir -p "$probe"
          cat > "$probe/index.php" <<'PHP'
          <?php
          header('Content-Type: application/json');
          if (PHP_SAPI !== 'fpm-fcgi' || PHP_VERSION !== '8.3.36' || ini_get('session.upload_progress.enabled') !== '0') { http_response_code(500); exit; }
          if (isset($_GET['hold'])) {
              file_put_contents('/probe/request-started', '1');
              $until = microtime(true) + 6;
              while (microtime(true) < $until) { usleep(100000); }
              file_put_contents('/probe/request-finished', '1');
          }
          echo json_encode(['php' => PHP_VERSION, 'sapi' => PHP_SAPI, 'upload_progress' => false]);
          PHP
          cat > "$probe/nginx.conf" <<'NGINX'
          server { listen 80; root /probe; include /etc/nginx/add/php.conf; }
          NGINX
          docker network create php83-ci
          trap 'docker rm -f php83-http php83-fpm >/dev/null 2>&1 || true; docker network rm php83-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name php83-fpm --network php83-ci --network-alias php -v "$probe:/probe" --entrypoint php-fpm ablaki-php83-ci
          docker run -d --name php83-http --network php83-ci -p 127.0.0.1:18083:80 -v "$probe/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$GITHUB_WORKSPACE/docker/nginx/add:/etc/nginx/add:ro" nginx:1.15
          if ! curl --fail --max-time 5 --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18083/; then
            docker logs php83-fpm
            docker logs php83-http
            exit 1
          fi
          python3 - <<'PY'
          import urllib.request, urllib.error
          origin = 'https://ablakin.ru'
          for path in ['/v1/world/start', '/v1/world/objects', '/v1/world/onboarding/join']:
              request = urllib.request.Request('http://127.0.0.1:18083' + path, method='OPTIONS', headers={
                  'Origin': origin, 'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'authorization,content-type,idempotency-key'})
              with urllib.request.urlopen(request, timeout=5) as response:
                  assert response.status == 204
                  assert response.headers.get_all('Access-Control-Allow-Origin') == ['*']
                  assert 'POST' in response.headers['Access-Control-Allow-Methods'].split(', ')
                  allowed = {value.strip().lower() for value in response.headers['Access-Control-Allow-Headers'].split(',')}
                  assert {'authorization', 'content-type', 'idempotency-key'} <= allowed, allowed
          try:
              urllib.request.urlopen('http://127.0.0.1:18083/missing.php', timeout=5)
              raise AssertionError('Expected an error response')
          except urllib.error.HTTPError as response:
              assert response.code == 404
              assert response.headers.get_all('Access-Control-Allow-Origin') == ['*']
          print('PASS real production nginx configuration: world preflight and error CORS')
          PY
          for marker in request-started request-finished cli-started cli-finished; do touch "$probe/$marker"; chmod 666 "$probe/$marker"; done
          curl --fail --max-time 30 'http://127.0.0.1:18083/?hold=1' > "$RUNNER_TEMP/drained-response.json" &
          request_pid=$!
          for attempt in {1..30}; do [[ ! -s "$probe/request-started" ]] || break; sleep 0.1; done
          test -s "$probe/request-started"
          docker exec php83-fpm php -r 'file_put_contents("/probe/cli-started", "1"); sleep(5); file_put_contents("/probe/cli-finished", "1");' &
          cli_pid=$!
          for attempt in {1..30}; do [[ ! -s "$probe/cli-started" ]] || break; sleep 0.1; done
          test -s "$probe/cli-started"
          docker exec -i php83-fpm sh < deploy/php-drain.sh
          test -s "$probe/cli-finished"
          test -s "$probe/request-finished"
          wait "$request_pid"
          wait "$cli_pid"
          curl --fail --max-time 5 http://127.0.0.1:18083/
          docker stop --time 10 php83-fpm
          test "$(docker inspect -f '{{.State.ExitCode}}' php83-fpm)" = 0
  deploy:
    name: Deploy backend to ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
    needs:
      - plan
      - minimum
      - full_before
      - runtime-image
    if: >-
      always() && needs.plan.outputs.publish == 'true' && needs.minimum.result == 'success'
      && (needs.runtime-image.result == 'success' || (needs.plan.outputs.runtime == 'false' && needs.runtime-image.result == 'skipped'))
      && (needs.full_before.result == 'success' || (needs.full_before.result == 'skipped' && (needs.plan.outputs.database == 'false' || github.ref == 'refs/heads/test' || inputs.target == 'test')))
      && github.event_name != 'pull_request' && github.event_name != 'schedule'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test' || (github.event_name == 'workflow_dispatch' && inputs.target == 'test' && github.ref_type == 'branch'))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: ${{ (inputs.target == 'test' || github.ref == 'refs/heads/test') && 'test-backend' || 'production-backend' }}
    concurrency:
      group: ${{ (inputs.target == 'test' || github.ref == 'refs/heads/test') && 'test-backend' || 'production-backend' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
      DEPLOY_HOST: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_HOST' || 'BACKEND_DEPLOY_HOST'] }}
      DEPLOY_PORT: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_PORT' || 'BACKEND_DEPLOY_PORT'] }}
      DEPLOY_USER: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_USER' || 'BACKEND_DEPLOY_USER'] }}
      DEPLOY_SSH_KEY: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_SSH_KEY' || 'BACKEND_DEPLOY_SSH_KEY'] }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_KNOWN_HOSTS' || 'BACKEND_DEPLOY_KNOWN_HOSTS'] }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment settings
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for backend deployment"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535))
      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          # Reuse the authenticated connection across SSH/scp calls in this job.
          # The socket belongs to this ephemeral runner; no key is stored in it.
          printf 'Host %s\n  ControlMaster auto\n  ControlPersist 60\n  ControlPath %s/backend-ssh-%%C\n' \
            "$DEPLOY_HOST" "$RUNNER_TEMP" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
      - name: Deploy the checked release
        id: release
        env:
          RELEASE_BASE: ${{ needs.plan.outputs.base }}
          LEGACY_MAINTENANCE: ${{ inputs.legacy_maintenance || inputs.activate_world }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TARGET" = test ]]; then
            deploy_root='/opt/ablaki-backend-test'
            repo_root='/var/code/ablaki'
          else
            deploy_root='/opt/ablaki-backend'
            repo_root='/var/www/api.ablakin.ru'
          fi
          [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$GITHUB_REF_NAME" != *..* ]]
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if ! ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$deploy_root' && test -w '$deploy_root'"; then
            echo "::error::Verify SSH access and that $deploy_root exists and is writable by the deployment user."
            exit 1
          fi
          scp "${options[@]}" -P "$DEPLOY_PORT" deploy/backend-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/backend-deploy.sh"
          if [[ "$TARGET" = test ]]; then
            scp "${options[@]}" -P "$DEPLOY_PORT" deploy/craft-prepare-test.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/craft-prepare-test.sh"
            ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$deploy_root/craft-prepare-test.sh'"
          fi
          if [[ "$TARGET" = production ]]; then
            [[ "$GITHUB_REF_NAME" = master ]]
            [[ -z "$RELEASE_BASE" || "$RELEASE_BASE" =~ ^[a-f0-9]{40}$ ]]
            if [[ "$LEGACY_MAINTENANCE" = true ]]; then
              scp "${options[@]}" -P "$DEPLOY_PORT" deploy/world-production-upgrade.sh deploy/php-drain.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/"
              ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$deploy_root/world-production-upgrade.sh' '$GITHUB_SHA'" | tee "$RUNNER_TEMP/backend-production-release.log"
            else
              scp "${options[@]}" -P "$DEPLOY_PORT" deploy/production-release.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/"
              ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$deploy_root/production-release.sh' '$GITHUB_SHA' '$RELEASE_BASE'" | tee "$RUNNER_TEMP/backend-production-release.log"
            fi
            if grep -Fxq '[world-production] Nginx-only release applied; application and database unchanged.' "$RUNNER_TEMP/backend-production-release.log"; then
              echo 'skip_additive_migrations=true' >> "$GITHUB_OUTPUT"
            fi
            if grep -Fxq '[world-production] Rating precision release applied; stored values verified.' "$RUNNER_TEMP/backend-production-release.log"; then
              echo 'skip_additive_migrations=true' >> "$GITHUB_OUTPUT"
            fi
          else
            ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash '$deploy_root/backend-deploy.sh' '$repo_root' '$GITHUB_REF_NAME' '$TARGET' '$GITHUB_SHA'"
          fi
      - name: Apply additive activity, craft and forum migrations
        shell: bash
        run: |
          # Only explicitly listed additive migrations in the established checkout.
          if [[ "$TARGET" = test ]]; then
            repo_root='/var/code/ablaki'
            install_context='CRAFT_TEST_INSTALL=confirmed-test-checkout'
            install_action='install-test'
          elif [[ "$TARGET" = production ]]; then
            [[ "$GITHUB_REF_NAME" = master ]]
            repo_root='/var/www/api.ablakin.ru'
            install_context='CRAFT_PRODUCTION_INSTALL=confirmed-production-checkout'
            install_action='install-production'
          else
            echo "::error::Unknown craft deployment target"
            exit 1
          fi
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e 'USER_ACTIVITY_INSTALL=confirmed-$TARGET-checkout' php php /web/yii2/yii activity-setup/install"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e '$install_context' php php /web/yii2/yii craft-setup/$install_action"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e 'FORUM_INSTALL=confirmed-$TARGET-checkout' php php /web/yii2/yii forum-setup/install"
        if: env.TARGET == 'production' && needs.plan.outputs.additive == 'true' && !inputs.activate_world && steps.release.outputs.skip_additive_migrations != 'true'
      - name: Apply and verify Telegram authentication migrations
        shell: bash
        run: |
          if [[ "$TARGET" = test ]]; then repo_root='/var/code/ablaki'; else repo_root='/var/www/api.ablakin.ru'; fi
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e 'TELEGRAM_AUTH_INSTALL=confirmed-$TARGET-checkout' php php /web/yii2/yii telegram-auth/install"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T php crontab /etc/ablaki-cron"
      - name: Prepare the explicitly requested funded economy test
        if: env.TARGET == 'test' && inputs.economy_test != '' && inputs.economy_test != 'skip'
        shell: bash
        env:
          ECONOMY_TEST: ${{ inputs.economy_test }}
          ECONOMY_DONOR: ${{ inputs.economy_donor }}
        run: |
          apply=0
          [[ "$ECONOMY_TEST" = prepare ]] && apply=1
          [[ "$ECONOMY_DONOR" =~ ^[A-Za-z0-9_-]{1,32}$ ]]
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /var/code/ablaki && test \"\$(pwd -P)\" = /var/code/ablaki && docker-compose exec -T -e WORLD_INSTALL=confirmed-world-install -e WORLD_TEST_SETUP=confirmed-test-checkout -e WORLD_TEST_MODE=1 php php /web/yii2/yii world-setup/economy-test-prepare '$apply' '$ECONOMY_DONOR'"
      - name: Activate the explicitly requested production world
        if: env.TARGET == 'production' && inputs.activate_world
        shell: bash
        env:
          STARTER_RESERVE: ${{ inputs.starter_reserve }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" = master && "$STARTER_RESERVE" =~ ^[0-9]{1,6}(\.[0-9]{1,4})?$ ]]
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /var/www/api.ablakin.ru/deploy/world-production-activate.sh '$GITHUB_SHA' '$STARTER_RESERVE'"
      - name: Verify deployed PHP, dependencies and background scheduler
        shell: bash
        run: |
          if [[ "$TARGET" = test ]]; then repo_root='/var/code/ablaki'; else repo_root='/var/www/api.ablakin.ru'; fi
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$repo_root'" <<'VERIFY'
          set -Eeuo pipefail
          cd "$1"
          test "$(pwd -P)" = "$1"
          docker-compose exec -T php php -r 'require "/web/yii2/vendor/autoload.php"; require "/web/yii2/vendor/yiisoft/yii2/Yii.php"; if (PHP_VERSION !== "8.3.36" || ini_get("session.upload_progress.enabled") !== "0") exit(1); $socket = @fsockopen("127.0.0.1", 9000); if (!$socket) exit(1); fclose($socket); echo json_encode(["php" => PHP_VERSION, "yii" => Yii::getVersion(), "upload_progress" => false, "fpm_ready" => true]), PHP_EOL;' </dev/null
          docker-compose exec -T php service cron status </dev/null
          docker-compose exec -T php composer check-platform-reqs </dev/null
          if [[ "$1" = /var/www/api.ablakin.ru ]]; then
            [[ "$(docker inspect -f '{{.State.Running}}' ablaki-world-worker-production)" = true ]]
            curl --fail --silent --show-error --max-time 30 http://127.0.0.1:2180/v1/stat > /dev/null
          fi
          VERIFY
          printf '### Backend ready: `%s`\n\nRequired checks and server readiness passed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  full_after:
    name: Extended checks after test deployment
    needs: [deploy, plan]
    if: ${{ always() && needs.deploy.result == 'success' && needs.plan.outputs.database == 'true' && (github.ref == 'refs/heads/test' || inputs.target == 'test') }}
    uses: ./.github/workflows/backend-full.yml
    with:
      target: test
      portable: ${{ needs.plan.outputs.portable == 'true' }}
      core_checked: true
  production_audit:
    name: Read-only production preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_audit }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: production-backend
    concurrency:
      group: ${{ inputs.progress_only && 'production-progress' || 'production-backend' }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect the existing checkout and database without deploying
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          mkdir -p "$RUNNER_TEMP/production-audit"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/api.ablakin.ru && test "$(pwd -P)" = /var/www/api.ablakin.ru && git -c safe.directory=/var/www/api.ablakin.ru rev-parse HEAD && git -c safe.directory=/var/www/api.ablakin.ru symbolic-ref --short HEAD && git -c safe.directory=/var/www/api.ablakin.ru status --porcelain --untracked-files=no && docker-compose ps && docker-compose exec -T php php -v' > "$RUNNER_TEMP/production-audit/runtime.txt"
          progress='${{ inputs.progress_only }}'
          [[ "$progress" = true || "$progress" = false ]]
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/api.ablakin.ru && test \"\$(pwd -P)\" = /var/www/api.ablakin.ru && docker-compose exec -T -e WORLD_INSPECT_PROGRESS=$progress php php" < deploy/world-production-inspect.php > "$RUNNER_TEMP/production-audit/database.json"
          python3 - "$RUNNER_TEMP/production-audit/database.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['read_only'] is True
          if report.get('progress_only'):
              print(json.dumps(report))
              sys.exit(0)
          print(json.dumps({k: report[k] for k in ['read_only','php','server','row_counts','wallet_guard_available']}))
          PY
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'if docker container inspect ablaki-world-worker-production >/dev/null 2>&1; then docker inspect -f "running={{.State.Running}} restart={{.HostConfig.RestartPolicy.Name}}" ablaki-world-worker-production; docker logs --tail 12 ablaki-world-worker-production 2>&1; fi' > "$RUNNER_TEMP/production-audit/worker.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-read-only-preflight
          path: ${{ runner.temp }}/production-audit
          retention-days: 7
