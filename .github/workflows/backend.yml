name: Backend CI and deployment

on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment (production requires master)
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ablakin_ci
          MYSQL_USER: ablakin_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ablakin_ci
          POSTGRES_USER: ablakin_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ablakin_ci -d ablakin_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - name: Validate requested target
        env:
          TARGET: ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            [[ "$GITHUB_REF_TYPE" = branch ]]
            [[ "$TARGET" = test || ( "$TARGET" = production && "$GITHUB_REF_NAME" = master ) ]]
          fi

      - name: Set up the supported PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none

      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh deploy/tests/*.sh docker/php/entrypoint.sh; do bash -n "$script"; done
          php -l yii2/yii
          php -l yii2/console/migrations/AbstractMigration.php
          php -l yii2/api/modules/v1/controllers/StatController.php
          php -l yii2/tests/release/frontend-api-routing.php
          bash deploy/tests/pipeline.sh

      - name: Install locked dependencies for the selected target
        working-directory: yii2
        env:
          TARGET: ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        shell: bash
        run: |
          # CI only: do not require new allow-plugins settings in the restored manifest.
          options=(--no-interaction --prefer-dist --no-progress --optimize-autoloader --no-plugins)
          if [[ "$TARGET" = production ]]; then options+=(--no-dev); fi
          composer install "${options[@]}"

      - name: Run isolated API checks
        working-directory: yii2
        shell: bash
        run: |
          for suite in auth-response frontend-lists frontend-api-routing game-overview five-game forum-gift daily-reward exchange-refund topic68-economy worker-barrier-test classic-craft classic-craft-install user-activity; do
            if ! php "tests/release/$suite.php" 2>&1 | tee "$RUNNER_TEMP/backend-$suite.log"; then
              details=$(tail -n 15 "$RUNNER_TEMP/backend-$suite.log")
              details=${details//%/%25}
              details=${details//$'\r'/%0D}
              details=${details//$'\n'/%0A}
              echo "::error file=yii2/tests/release/$suite.php,title=Isolated API check failed::$details"
              exit 1
            fi
          done

      - name: Check MySQL and PostgreSQL transactions
        working-directory: yii2
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          # PHP 7.3 requires the legacy authentication plugin in this disposable MySQL 8 service.
          docker exec "$MYSQL_CONTAINER" mysql -uroot -pci-only-root -e "ALTER USER 'ablakin_ci'@'%' IDENTIFIED WITH mysql_native_password BY 'ci-only-password';"
          check_database() {
            export ABL_TEST_DSN="$1"
            php tests/release/target-database.php && php tests/release/classic-craft.php && php tests/release/user-activity.php
          }
          # Independent disposable databases; keep suites sequential within each database.
          check_database 'mysql:host=127.0.0.1;port=3306;dbname=ablakin_ci' > "$RUNNER_TEMP/mysql-checks.log" 2>&1 &
          mysql_pid=$!
          check_database 'pgsql:host=127.0.0.1;port=5432;dbname=ablakin_ci' > "$RUNNER_TEMP/pgsql-checks.log" 2>&1 &
          pgsql_pid=$!
          failed=0
          wait "$mysql_pid" || failed=1
          wait "$pgsql_pid" || failed=1
          cat "$RUNNER_TEMP/mysql-checks.log" "$RUNNER_TEMP/pgsql-checks.log"
          exit "$failed"

  deploy:
    name: Deploy backend to ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test' || (github.event_name == 'workflow_dispatch' && inputs.target == 'test' && github.ref_type == 'branch'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ (inputs.target == 'test' || github.ref == 'refs/heads/test') && 'test-backend' || 'production-backend' }}
    concurrency:
      group: ${{ (inputs.target == 'test' || github.ref == 'refs/heads/test') && 'test-backend' || 'production-backend' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ (github.ref == 'refs/heads/test' && 'test') || inputs.target || 'production' }}
      DEPLOY_HOST: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_HOST' || 'BACKEND_DEPLOY_HOST'] }}
      DEPLOY_PORT: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_PORT' || 'BACKEND_DEPLOY_PORT'] }}
      DEPLOY_USER: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_USER' || 'BACKEND_DEPLOY_USER'] }}
      DEPLOY_SSH_KEY: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_SSH_KEY' || 'BACKEND_DEPLOY_SSH_KEY'] }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets[(inputs.target == 'test' || github.ref == 'refs/heads/test') && 'TEST_BACKEND_DEPLOY_KNOWN_HOSTS' || 'BACKEND_DEPLOY_KNOWN_HOSTS'] }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment settings
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for backend deployment"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535))

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Run git pull and make up on the VPS
        shell: bash
        run: |
          if [[ "$TARGET" = test ]]; then
            deploy_root='/opt/ablaki-backend-test'
            repo_root='/var/code/ablaki'
          else
            deploy_root='/opt/ablaki-backend'
            repo_root='/var/www/api.ablakin.ru'
          fi
          [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$GITHUB_REF_NAME" != *..* ]]
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if ! ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$deploy_root' && test -w '$deploy_root'"; then
            echo "::error::Verify SSH access and that $deploy_root exists and is writable by the deployment user."
            exit 1
          fi
          scp "${options[@]}" -P "$DEPLOY_PORT" deploy/backend-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/backend-deploy.sh"
          if [[ "$TARGET" = test ]]; then
            scp "${options[@]}" -P "$DEPLOY_PORT" deploy/craft-prepare-test.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_root/craft-prepare-test.sh"
            ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$deploy_root/craft-prepare-test.sh'"
          fi
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$deploy_root/backend-deploy.sh' '$repo_root' '$GITHUB_REF_NAME' '$TARGET'"

      - name: Apply additive activity and craft migrations
        shell: bash
        run: |
          # Only explicitly listed additive migrations in the established checkout.
          if [[ "$TARGET" = test ]]; then
            repo_root='/var/code/ablaki'
            install_context='CRAFT_TEST_INSTALL=confirmed-test-checkout'
            install_action='install-test'
          elif [[ "$TARGET" = production ]]; then
            [[ "$GITHUB_REF_NAME" = master ]]
            repo_root='/var/www/api.ablakin.ru'
            install_context='CRAFT_PRODUCTION_INSTALL=confirmed-production-checkout'
            install_action='install-production'
          else
            echo "::error::Unknown craft deployment target"
            exit 1
          fi
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e 'USER_ACTIVITY_INSTALL=confirmed-$TARGET-checkout' php php /web/yii2/yii activity-setup/install"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$repo_root' && test \"\$(pwd -P)\" = '$repo_root' && docker-compose exec -T -e '$install_context' php php /web/yii2/yii craft-setup/$install_action"
