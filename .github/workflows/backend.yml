name: Backend CI and deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment (production requires master)
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Backend checks and dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate requested target
        env:
          TARGET: ${{ inputs.target || 'production' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            [[ "$GITHUB_REF_TYPE" = branch ]]
            [[ "$TARGET" = test || ( "$TARGET" = production && "$GITHUB_REF_NAME" = master ) ]]
          fi

      - name: Set up the supported PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none

      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh deploy/tests/*.sh docker/php/entrypoint.sh; do bash -n "$script"; done
          php -l deploy/database-fingerprint.php
          php -l deploy/check-api.php
          php -l yii2/yii
          bash deploy/tests/pipeline.sh
          bash deploy/tests/compose-config.sh

      - name: Install locked dependencies for the selected target
        working-directory: yii2
        env:
          TARGET: ${{ inputs.target || 'production' }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        shell: bash
        run: |
          options=(--no-interaction --prefer-dist --no-progress --optimize-autoloader)
          if [[ "$TARGET" = production ]]; then options+=(--no-dev); fi
          composer install "${options[@]}"

      - name: Run isolated API checks
        working-directory: yii2
        shell: bash
        run: |
          for suite in frontend-lists frontend-api-routing game-overview forum-gift daily-reward exchange-refund health; do
            if ! php "tests/release/$suite.php" 2>&1 | tee "$RUNNER_TEMP/backend-$suite.log"; then
              details=$(tail -n 15 "$RUNNER_TEMP/backend-$suite.log")
              details=${details//%/%25}
              details=${details//$'\r'/%0D}
              details=${details//$'\n'/%0A}
              echo "::error file=yii2/tests/release/$suite.php,title=Isolated API check failed::$details"
              exit 1
            fi
          done

      - name: Package checked dependencies
        shell: bash
        run: |
          mkdir -p release yii2/vendor/bin
          cp "$(command -v composer)" yii2/vendor/bin/deploy-composer.phar
          printf '%s\n' "$GITHUB_SHA" > yii2/commit.txt
          sha256sum yii2/composer.lock | cut -d' ' -f1 > yii2/composer.lock.sha256
          tar -C yii2 -czf release/vendor.tar.gz vendor commit.txt composer.lock.sha256
          (cd release && sha256sum vendor.tar.gz > vendor.tar.gz.sha256)

      - name: Save release artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: PHP image and PostgreSQL installation
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: backend-${{ github.sha }}
          path: release
      - name: Build the production PHP image
        run: bash deploy/tests/report-check.sh docker build --tag ablaki-php-ci docker/php
      - name: Validate API nginx configurations
        run: bash deploy/tests/report-check.sh bash deploy/tests/nginx-config.sh
      - name: Verify fresh migrations and backup restore in disposable PostgreSQL
        run: bash deploy/tests/report-check.sh bash deploy/tests/first-install.sh

  deploy:
    name: Deploy backend to ${{ inputs.target || 'production' }}
    needs: [checks, runtime]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.target == 'test' && github.ref_type == 'branch'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ inputs.target == 'test' && 'test-backend' || 'production-backend' }}
    concurrency:
      group: ${{ inputs.target == 'test' && 'test-backend' || 'production-backend' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'production' }}
      DEPLOY_HOST: ${{ secrets[inputs.target == 'test' && 'TEST_BACKEND_DEPLOY_HOST' || 'BACKEND_DEPLOY_HOST'] }}
      DEPLOY_PORT: ${{ secrets[inputs.target == 'test' && 'TEST_BACKEND_DEPLOY_PORT' || 'BACKEND_DEPLOY_PORT'] }}
      DEPLOY_USER: ${{ secrets[inputs.target == 'test' && 'TEST_BACKEND_DEPLOY_USER' || 'BACKEND_DEPLOY_USER'] }}
      DEPLOY_SSH_KEY: ${{ secrets[inputs.target == 'test' && 'TEST_BACKEND_DEPLOY_SSH_KEY' || 'BACKEND_DEPLOY_SSH_KEY'] }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets[inputs.target == 'test' && 'TEST_BACKEND_DEPLOY_KNOWN_HOSTS' || 'BACKEND_DEPLOY_KNOWN_HOSTS'] }}
      API_URL: ${{ vars[inputs.target == 'test' && 'TEST_BACKEND_HEALTHCHECK_URL' || 'BACKEND_HEALTHCHECK_URL'] }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-${{ github.sha }}
          path: release

      - name: Validate deployment settings
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS API_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for backend deployment"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535))
          [[ "$API_URL" =~ ^https?://[A-Za-z0-9._:-]+(/[A-Za-z0-9._/-]+)?/$ && "$API_URL" != *..* ]]
          if [[ "$TARGET" = production ]]; then
            [[ "$API_URL" = 'https://api.ablakin.ru/' ]]
          else
            api_host=${API_URL#*://}; api_host=${api_host%%/*}; api_host=${api_host%%:*}
            [[ "${api_host,,}" != api.ablakin.ru ]]
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload and deploy the checked backend
        shell: bash
        run: |
          if [[ "$TARGET" = test ]]; then
            deploy_root='/opt/ablaki-backend-test'
            repo_root='/var/code/ablaki'
          else
            deploy_root='/opt/ablaki-backend'
            repo_root='/var/www/api.ablakin.ru'
          fi
          [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$GITHUB_REF_NAME" != *..* ]]
          remote_dir="$deploy_root/incoming/$GITHUB_SHA"
          options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if ! ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$deploy_root' && test -w '$deploy_root' && umask 077 && mkdir -p '$remote_dir' && chmod 700 '$remote_dir'"; then
            echo "::error::Cannot prepare $remote_dir over SSH. Verify SSH access and that $deploy_root exists and is writable by the deployment user."
            exit 1
          fi
          scp "${options[@]}" -P "$DEPLOY_PORT" release/vendor.tar.gz release/vendor.tar.gz.sha256 deploy/backend-deploy.sh deploy/check-api.php "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_dir/backend-deploy.sh' '$repo_root' '$GITHUB_SHA' '$remote_dir/vendor.tar.gz' '$API_URL' '$deploy_root' '$GITHUB_REF_NAME' '$TARGET'"
