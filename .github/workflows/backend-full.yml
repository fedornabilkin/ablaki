name: Extended backend checks
'on':
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      portable:
        type: boolean
        default: true
      core_checked:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  isolated:
    name: Isolated API and world regression checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3.36
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none
      - uses: actions/cache@v5
        with:
          path: yii2/vendor
          key: ${{ runner.os }}-php8336-release-${{ hashFiles('yii2/composer.lock') }}
      - name: Install locked production dependencies
        working-directory: yii2
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Check locked dependency advisories
        working-directory: yii2
        run: composer audit --locked --no-dev --abandoned=ignore
      - name: Run isolated application suites
        env:
          CORE_CHECKED: ${{ inputs.core_checked }}
        run: bash deploy/backend-checks.sh isolated
  mariadb-compatibility:
    name: MariaDB 10.1 production compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.1.48
        env:
          MYSQL_DATABASE: ablakin_ci
          MYSQL_USER: ablakin_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3.36
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none
      - uses: actions/cache@v5
        with:
          path: yii2/vendor
          key: ${{ runner.os }}-php8336-release-${{ hashFiles('yii2/composer.lock') }}
      - name: Install locked production dependencies
        working-directory: yii2
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Match production database character set and legacy InnoDB limits
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: docker exec "$MARIADB_CONTAINER" mysql -uroot -pci-only-root -e "ALTER DATABASE ablakin_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SET GLOBAL innodb_file_format='Antelope'; SET GLOBAL innodb_large_prefix=OFF; SET GLOBAL sql_mode='NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION';"
      - name: Verify legacy DDL and concurrent game operations
        env:
          ABL_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=ablakin_ci
        run: bash deploy/backend-checks.sh mariadb
  portability:
    name: MySQL 8 and PostgreSQL 16 compatibility
    if: inputs.portable
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ablakin_ci
          MYSQL_USER: ablakin_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ablakin_ci
          POSTGRES_USER: ablakin_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U ablakin_ci -d ablakin_ci" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3.36
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, intl, gd, curl, zip
          tools: composer:2.10.3
          coverage: none
      - uses: actions/cache@v5
        with:
          path: yii2/vendor
          key: ${{ runner.os }}-php8336-release-${{ hashFiles('yii2/composer.lock') }}
      - name: Install locked production dependencies
        working-directory: yii2
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Run both database suites independently
        shell: bash
        run: |
          ABL_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=ablakin_ci' bash deploy/backend-checks.sh database > "$RUNNER_TEMP/mysql-checks.log" 2>&1 &
          mysql_pid=$!
          ABL_TEST_DSN='pgsql:host=127.0.0.1;port=5432;dbname=ablakin_ci' bash deploy/backend-checks.sh database > "$RUNNER_TEMP/pgsql-checks.log" 2>&1 &
          pgsql_pid=$!
          failed=0
          wait "$mysql_pid" || failed=1
          wait "$pgsql_pid" || failed=1
          cat "$RUNNER_TEMP/mysql-checks.log" "$RUNNER_TEMP/pgsql-checks.log"
          exit "$failed"
